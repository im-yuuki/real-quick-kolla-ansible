[cors]
allowed_origin = https://horizon.openstack.local,https://skyline.openstack.local
allow_methods = GET,POST,PUT,DELETE,PATCH
allow_headers = Content-Type,Cache-Control,Content-Language,Expires,Last-Modified,Pragma,X-Auth-Token,X-CSRFToken,X-OpenStack-Request-ID
allow_credentials = true
max_age = 3600
