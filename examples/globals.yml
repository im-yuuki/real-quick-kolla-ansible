---
workaround_ansible_issue_8743: true

kolla_base_distro: "debian"
kolla_container_engine: docker

# eth0 for internet + user access, ens19 for internal communication among all nodes
network_interface: "ens19"
kolla_internal_vip_address: "100.64.0.1"
kolla_external_vip_interface: "eth0"
kolla_external_vip_address: "10.0.0.1"
keepalived_virtual_router_id: "169"

neutron_plugin_agent: "openvswitch"
neutron_external_interface: "ens20"
enable_neutron_provider_networks: true

kolla_enable_tls_external: true

enable_horizon: true
enable_skyline: true

enable_trove: true
enable_trove_singletenant: true

enable_magnum: true
enable_heat: true
enable_barbican: true
enable_octavia: true
