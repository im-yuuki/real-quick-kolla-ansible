---
workaround_ansible_issue_8743: true

kolla_base_distro: "debian"
kolla_container_engine: "docker"
# docker_registry: "quay.io"
# docker_namespace: "openstack.kolla"
# openstack_tag_suffix: "-aarch64"

network_interface: "eth0"
kolla_internal_vip_address: "100.64.0.1"
kolla_enable_tls_external: true

kolla_external_vip_interface: "eth1"
kolla_external_vip_address: "10.0.0.1"
kolla_external_fqdn: "openstack.local"
keepalived_virtual_router_id: "131"

neutron_external_interface: "eth2"
neutron_plugin_agent: "ovn"
enable_neutron_provider_networks: true

enable_haproxy: true
enable_keepalived: true
enable_mariadb: true
enable_rabbitmq: true
enable_ovn: true

enable_keystone: true
enable_horizon: true
enable_skyline: true

# [ONLY ENABLE IF YOU HAVE CEPH CONFIGURED]
# enable_cinder: true
# glance_backend_ceph: true
# cinder_backend_ceph: true
# cinder_backup_driver: "ceph"
# nova_backend_ceph: true
# enable_valkey: true
# cinder_cluster_name: "cinder"

enable_magnum: true
enable_heat: true
enable_barbican: true
enable_octavia: true
enable_masakari: true
