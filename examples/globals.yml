---
workaround_ansible_issue_8743: true

kolla_base_distro: "ubuntu"
kolla_container_engine: "docker"
# docker_registry: "quay.io"
# docker_namespace: "openstack.kolla"
# openstack_tag_suffix: "-aarch64"

network_interface: "eth0"
kolla_internal_vip_address: "100.64.0.1"
kolla_enable_tls_external: true

kolla_external_vip_interface: "eth1"
kolla_external_vip_address: "10.0.0.1"
kolla_external_fqdn: "openstack.local"
keepalived_virtual_router_id: "131"

neutron_external_interface: "eth2"
neutron_plugin_agent: "ovn"
enable_neutron_provider_networks: true

enable_haproxy: true
enable_keepalived: true
enable_mariadb: true
enable_rabbitmq: true
enable_ovn: true

enable_keystone: true
enable_horizon: true
enable_skyline: true

# [ONLY ENABLE IF YOU HAVE CEPH CONFIGURED]
# enable_cinder: true
# glance_backend_ceph: true
# cinder_backend_ceph: true
# cinder_backup_driver: "ceph"
# nova_backend_ceph: true
# enable_valkey: true
# cinder_cluster_name: "cinder"

# enable_magnum: true
# enable_heat: true
# enable_barbican: true
enable_octavia: true
enable_masakari: true

# [IF YOU WANT TO SET UP PUBLIC ACCESS]
# haproxy_single_external_frontend: true
#
# horizon_external_fqdn:           "horizon.openstack.local"
# keystone_external_fqdn:          "keystone.openstack.local"
# glance_external_fqdn:            "glance.openstack.local"
# nova_external_fqdn:              "nova.openstack.local"
# nova_novncproxy_fqdn:            "novnc.openstack.local"
# nova_metadata_external_fqdn:     "metadata.openstack.local"
# nova_serialproxy_fqdn:           "serial.openstack.local"
# nova_spicehtml5proxy_fqdn:       "spice.openstack.local"
# neutron_external_fqdn:           "neutron.openstack.local"
# placement_external_fqdn:         "placement.openstack.local"
# cinder_external_fqdn:            "cinder.openstack.local"
# heat_external_fqdn:              "heat.openstack.local"
# heat_cfn_external_fqdn:          "heat-cfn.openstack.local"
# barbican_external_fqdn:          "barbican.openstack.local"
# octavia_external_fqdn:           "octavia.openstack.local"
# magnum_external_fqdn:            "magnum.openstack.local"
# masakari_external_fqdn:          "masakari.openstack.local"
# skyline_console_external_fqdn:   "skyline.openstack.local"
# skyline_apiserver_external_fqdn: "dont-set-dns-for-this--skyline-api.openstack.local"

# [CUSTOM IMAGES with newer Ceph client]
# glance_api_image_full:   "ghcr.io/im-yuuki/real-quick-kolla-ansible/glance-api:2026.1-ubuntu-noble-tentacle"
# cinder_volume_image_full: "ghcr.io/im-yuuki/real-quick-kolla-ansible/cinder-volume:2026.1-ubuntu-noble-tentacle"
# cinder_backup_image_full: "ghcr.io/im-yuuki/real-quick-kolla-ansible/cinder-backup:2026.1-ubuntu-noble-tentacle"
# nova_compute_image_full:  "ghcr.io/im-yuuki/real-quick-kolla-ansible/nova-compute:2026.1-ubuntu-noble-tentacle"
# nova_libvirt_image_full:  "ghcr.io/im-yuuki/real-quick-kolla-ansible/nova-libvirt:2026.1-ubuntu-noble-tentacle"
